<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8cc56b">
  <meta name="robots" content="noindex">
  <title>Petal Patch</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌷</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <section id="screen-garden" class="screen" aria-label="Your garden">
      <header class="topbar">
        <h1 class="brand">Petal Patch</h1>
        <div id="streak" class="streak" aria-live="polite"></div>
        <button id="mute-btn" class="icon-btn" aria-label="Sound is on. Tap to turn it off.">🔊</button>
      </header>
      <button id="collection-strip" class="collection-strip" aria-label="Your flower collection"></button>
      <button id="sphinx-btn" class="sphinx-strip" aria-label="Old Moss the garden gnome"></button>
      <div id="garden-scroll" class="garden-scroll">
        <div id="garden-scene"></div>
        <button id="whole-btn" class="whole-btn">🌼 See my whole garden</button>
      </div>
      <div class="actions">
        <button id="play-btn" class="btn primary big">Start playing</button>
        <div class="row">
          <button id="chest-btn" class="btn chest-btn hidden">🎁 Today's chest</button>
          <button id="code-btn" class="btn">🔑 I have a code</button>
        </div>
      </div>
    </section>

    <section id="screen-play" class="screen hidden" aria-label="Puzzle">
      <header class="topbar">
        <button id="back-btn" class="icon-btn wide" aria-label="Back to the garden">‹ Garden</button>
        <div id="board-title" class="board-title"></div>
        <button id="mute-btn-2" class="icon-btn" aria-label="Sound">🔊</button>
      </header>
      <div class="progress" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="tip" class="tip hidden"></div>
      <div id="board-wrap" class="board-wrap">
        <div id="board" class="board"></div>
      </div>
      <div class="tray-wrap">
        <div id="tray" class="tray" aria-label="Tray"></div>
      </div>
      <div class="play-actions">
        <div id="tiles-left" class="tiles-left"></div>
        <button id="undo-btn" class="btn undo-btn">↶ Undo</button>
      </div>
    </section>

    <section id="screen-whole" class="screen whole hidden" aria-label="Your whole garden">
      <header class="topbar">
        <div class="whole-title"><b>My whole garden</b><span id="whole-count"></span></div>
        <button id="whole-close" class="icon-btn wide" aria-label="Close the whole garden">✕ Close</button>
      </header>
      <p class="whole-hint">Tap anything to see its name.</p>
      <div id="whole-scroll" class="whole-scroll">
        <div id="whole-scene"></div>
        <div id="whole-name" class="whole-name hidden" aria-live="polite"></div>
        <button id="whole-close-2" class="btn primary big whole-close-2">Back to my garden</button>
      </div>
    </section>

    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
      <div id="sheet" class="sheet"></div>
    </div>
    <div id="fx" class="fx" aria-hidden="true"></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
